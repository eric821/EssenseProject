services:

  # ========================================
  # Apache + PHP + Node + React
  # ========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: essense-project
    restart: unless-stopped

    ports:
      - "8080:80"
      - "5173:5173"

    volumes:
      - ./site:/var/www/html

    environment:
      DB_HOST: mysql
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: app_password

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - lamp-network


  # ========================================
  # MySQL
  # ========================================
  mysql:
    image: mysql:8.4

    container_name: lamp-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - lamp-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uapp",
          "-papp_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ========================================
  # phpMyAdmin
  # ========================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lamp-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lamp-network


networks:
  lamp-network:
    driver: bridge


volumes:
  mysql-data: